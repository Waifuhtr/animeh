# Version catalog. Every dependency version is declared once, here, so a bump
# is one edit and two modules can never disagree about a version.

[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
hilt = "2.53.1"
hiltNavigation = "1.2.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
retrofitSerialization = "1.0.0"
room = "2.6.1"
datastore = "1.1.1"
coil = "2.7.0"
media3 = "1.5.1"
security = "1.1.0-alpha06"
paging = "3.3.5"
pagingCompose = "3.3.5"
work = "2.10.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
coroutinesTest = "1.9.0"
turbine = "1.2.0"
mockwebserver = "4.12.0"
desugar = "2.1.4"

